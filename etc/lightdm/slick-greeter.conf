[Greeter]
# Gruvbox, matching config/awesome/gruvbox-theme
background=/usr/share/backgrounds/awesome-wallpaper.jpg
background-color=#1d2021
draw-user-backgrounds=false
draw-grid=false
theme-name=Adwaita-dark
icon-theme-name=Adwaita
# Installed system-wide in /usr/local/share/fonts (lightdm cannot read ~)
font-name=GohuFont 14 Nerd Font Mono 12
show-hostname=true
show-power=true
show-a11y=false
show-keyboard=false
show-clock=true
clock-format=%a %d %b  %R
activate-numlock=true
