set -g mouse on

# As I was having problems with C-b not working as default
unbind C-b
set-option -g prefix C-b
set-option -g set-clipboard on
bind C-b send-prefix

# Fix for JAVA_HOME etc not updating in nvim

set -g update-environment "DISPLAY SSH_AUTH_SOCK SSH_CONNECTION WINDOWID XAUTHORITY JAVA_HOME"

# Performance settings
set-option -g history-limit 2000
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -as terminal-features ",*:RGB"
set -g focus-events on
set -g escape-time 10
set -sg repeat-time 0
set-option -g status-interval 5
setw -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}'

# Keybindings

# Alt+vim directionals switch pane
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Alt+n = next window
bind -n M-n next-window

# Alt+m = previous window
bind -n M-m previous-window

# TPM plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin '2kabhishek/tmux2k'

set -g @tmux2k-theme 'monokai'
set -g @tmux2k-icons-only true

set -g @tmux2k-show-powerline true
set -g @tmux2k-time-format '%d/%m/%y %H:%M'

set -g @tmux2k-left-plugins "session cpu ram"
set -g @tmux2k-right-plugins "battery network time"

set -g @tmux2k-duo-fg "#303030" 
set -g @tmux2k-duo-bg "#303030"

# TPM plugin manager path
run '~/.tmux/plugins/tpm/tpm'

