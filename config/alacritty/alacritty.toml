[general]
import = [
    "~/.config/alacritty/themes/themes/gruvbox_dark.toml"
]

[env]
TERM = "xterm-256color"

[font]
size = 10 

[font.bold]
family = "GohuFont 14 Nerd Font Mono"
style = "Bold"

[font.bold_italic]
family = "GohuFont 14 Nerd Font Mono"
style = "Bold Italic"

[font.italic]
family = "GohuFont 14 Nerd Font Mono"
style = "Italic"

[font.normal]
family = "GohuFont 14 Nerd Font Mono"
style = "Regular"

[scrolling]
history = 2000

[window]
decorations = "full"
title = "Alacritty"

[window.dimensions]
columns = 120
lines = 50

